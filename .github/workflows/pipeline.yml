name: Automated API Pipeline

on:
  schedule:
    - cron: '0 * * * *'  # Runs exactly at the top of every hour
  workflow_dispatch:     # Allows manual triggering

jobs:
  run-etl-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run ETL Script
        run: python api_pipeline.py

      - name: Commit and Push Database Update
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add crypto_historical_data.db
          git commit -m "Automated database update" || echo "No changes to commit"
          git push
